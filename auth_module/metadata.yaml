apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: clean-auth-component
spec:
  info:
    title: Clean Authentication Component
    version: 1.0.0
    actuationTool:
      flavor: Terraform
      version: ">= 1.3"
  interfaces:
    variables:
      - name: auth_prefix
        description: Prefix for generated authorization keys
        varType: string
        defaultValue: poc-auth
    outputs:
      - name: security_key
        description: Security token key string
        type: string
